services:
  - type: web
    name: warehouse-logistics
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: APP_MODE
        value: demo
      - key: SERVE_WEB
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: warehouse-db
          property: connectionString

databases:
  - name: warehouse-db
    databaseName: warehouse
    plan: free
